name: 'Build and Publish'

on:
  workflow_dispatch:

env:
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  GAR_PROJECT_ID: ${{ secrets.GAR_PROJECT_ID }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  IMAGE_NAME: calcul

jobs:
  Build-Containers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev

      - name: Set short git commit SHA
        id: vars
        run: echo "DOCKER_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Native Image and Stage Docker
        run: sbt "backend/Docker/stage"
        env:
          SBT_OPTS: -Xmx12G
          DOCKER_TAG: ${{ env.DOCKER_TAG }}
          NATIVE_IMAGE: 'true'

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          docker build -t $IMAGE_TAG backend/target/docker/stage
          docker push $IMAGE_TAG
