services:
  postgres:
    image: postgres:16-alpine
    container_name: caltrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calcul}
      POSTGRES_USER: ${POSTGRES_USER:-calcul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calcul_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calcul} -d ${POSTGRES_DB:-calcul}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    image: ${IMAGE_NAME:-calcul-backend}:${DOCKER_TAG:-local}
    container_name: caltrack-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-calcul}
      DB_USER: ${POSTGRES_USER:-calcul}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-calcul_secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/callback}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret-in-production}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
